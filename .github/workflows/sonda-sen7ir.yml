name: sonda-sen7ir
on: { push: { branches-ignore: [main] } }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "site:sen7ir.pt" "site:sen7ir.pt futebol" "site:sen7ir.pt futebol -futsal -andebol -basquetebol -voleibol -hóquei -atletismo -ciclismo" "site:sen7ir.pt (futsal OR andebol OR basquetebol OR voleibol OR hóquei OR atletismo OR ciclismo OR natação OR ténis OR padel OR rugby OR râguebi OR karaté OR judo)"; do
            for w in "when:7d" ""; do
              echo "=== $q $w"
              curl -s "https://news.google.com/rss/search?q=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$q $w")&hl=pt-PT&gl=PT&ceid=PT:pt-150" | python3 -c '
          import sys,re
          x=sys.stdin.read(); its=re.findall(r"<item>(.*?)</item>",x,re.S); print(len(its),"itens")
          for i in its[:12]:
            t=re.search(r"<title>(.*?)</title>",i,re.S).group(1); d=re.search(r"<pubDate>(.*?)</pubDate>",i).group(1); s=re.search(r"<source url=\"([^\"]*)\"",i); print("  ",d[:16],"|",s.group(1) if s else "","|",t[:110])'
            done
          done
