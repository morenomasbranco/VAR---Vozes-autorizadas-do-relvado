name: sonda-sen7ir
on: { push: { branches-ignore: [main] } }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir p && cd p && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > s.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch(); const pg = await b.newPage();
          pg.on("response", async (r) => {
            const u = r.url();
            if (/posts2|fastly\.net|\/api\//.test(u) && !/\.(js|css|png|jpg|webp|svg|woff2?)(\?|$)/.test(u)) {
              let t = ""; try { t = (await r.text()).slice(0, 1500); } catch {}
              console.log("PEDIDO", r.request().method(), r.status(), u); console.log("   ", t.replace(/\s+/g, " "));
            }
          });
          await pg.goto("https://www.sen7ir.pt/t/desporto/", { waitUntil: "networkidle", timeout: 60000 });
          await pg.waitForTimeout(4000);
          console.log("TITULOS", JSON.stringify(await pg.$$eval("a", (as) => as.map((a) => [a.textContent.trim().replace(/\s+/g, " ").slice(0, 100), a.href]).filter(([t, h]) => t.length > 25 && /sen7ir\.pt/.test(h)).slice(0, 25))));
          await b.close();
          JS
          node s.mjs
